{% extends "templates/smarto_base.html" %}

{% block title %}Order confirmation | SmartO{% endblock %}

{% block smarto_content %}
<main class="smarto-page">
  <header class="smarto-page-heading">
    <div>
      <p class="smarto-eyebrow">Order update</p>
      <h1>Order confirmation.</h1>
      <p id="order-status" class="smarto-inline-status" role="status" aria-live="polite">Loading order...</p>
    </div>
    <a id="order-login" class="smarto-button" hidden>Sign in to view this order</a>
  </header>
  <div id="order-detail" class="smarto-order-detail"></div>
  <nav class="smarto-actions" aria-label="Order navigation">
    <a class="smarto-button smarto-button-secondary" href="/account">Order history</a>
    <a class="smarto-button" href="/checkout">Checkout</a>
  </nav>
</main>
<script type="module" src="/assets/intelligent_ordering/js/order-confirmation.js"></script>
{% endblock %}
