{% extends "templates/smarto_base.html" %}

{% block title %}Order confirmation | SmartO{% endblock %}

{% block smarto_content %}
<main class="smarto-page">
  <p class="smarto-eyebrow">Order update</p>
  <h1>Order confirmation</h1>
  <p id="order-status" role="status" aria-live="polite">Loading order...</p>
  <a id="order-login" hidden>Sign in to view this order</a>
  <div id="order-detail"></div>
  <p><a href="/store#order-history">View your order history and payment options</a></p>
</main>
<script type="module" src="/assets/intelligent_ordering/js/order-confirmation.js"></script>
{% endblock %}
