{% extends "templates/smarto_base.html" %}
{% block title %}My profile | SmartO{% endblock %}
{% block smarto_content %}
<main class="smarto-page" data-customer-page="profile">
  <h1>My profile</h1>
  {% include "templates/includes/customer_navigation.html" %}
  <p id="customer-status" role="status" aria-live="polite">Loading profile...</p>
  <p id="customer-feedback" role="alert"></p>
  <a id="customer-login" href="/login?redirect-to=%2Faccount%2Fprofile" hidden>Sign in to manage your profile</a>
  <form id="customer-form" class="smarto-checkout-form" hidden>
    <p id="customer-email"></p>
    <label>Full name <input name="full_name" maxlength="140" autocomplete="name" required></label>
    <label>Phone <input name="phone" type="tel" maxlength="20" autocomplete="tel" required></label>
    <button class="smarto-button" type="submit">Save profile</button>
  </form>
  <p><a href="/forgot-password">Password recovery</a></p>
</main>
<script type="module" src="/assets/intelligent_ordering/js/customer-portal.js"></script>
{% endblock %}
