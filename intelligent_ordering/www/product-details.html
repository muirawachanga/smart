{% extends "templates/smarto_base.html" %}

{% block title %}Product details | SmartO{% endblock %}

{% block smarto_content %}
<main class="smarto-page" data-catalog-page="detail">
  <nav class="smarto-breadcrumb-inline" aria-label="Product navigation">
    <a href="/products">Products</a>
    <span aria-hidden="true">/</span>
    <span>Product details</span>
  </nav>
  <p id="product-status" class="smarto-inline-status" role="status" aria-live="polite">Loading product...</p>
  <p id="cart-feedback" role="status" aria-live="polite"></p>
  <div id="product-detail"></div>
  <section id="related-products-section" class="smarto-home-section" aria-labelledby="related-products-heading" hidden>
    <div class="smarto-section-heading">
      <div>
        <p class="smarto-eyebrow">Keep exploring</p>
        <h2 id="related-products-heading">More in this category</h2>
      </div>
      <a class="smarto-text-link" href="/products">Browse all products <span aria-hidden="true">→</span></a>
    </div>
    <p id="related-products-status" class="smarto-inline-status" role="status" aria-live="polite"></p>
    <div id="related-products" class="smarto-product-grid"></div>
  </section>
</main>
<script type="module" src="/assets/intelligent_ordering/js/catalog-pages.js"></script>
{% endblock %}
