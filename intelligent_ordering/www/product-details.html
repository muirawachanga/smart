{% extends "templates/smarto_base.html" %}

{% block title %}Product details | SmartO{% endblock %}

{% block smarto_content %}
<main class="smarto-page" data-catalog-page="detail">
  <p class="smarto-eyebrow">Product</p>
  <h1>Product details</h1>
  <p id="product-status" role="status" aria-live="polite">Loading product...</p>
  <p id="cart-feedback" role="status" aria-live="polite"></p>
  <div id="product-detail"></div>
  <p><a href="/products">Return to products</a> | <a href="/cart">Review your cart</a></p>
</main>
<script type="module" src="/assets/intelligent_ordering/js/catalog-pages.js"></script>
{% endblock %}
