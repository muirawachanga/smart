{% extends "templates/smarto_base.html" %}

{% block title %}Categories | SmartO{% endblock %}

{% block smarto_content %}
<main class="smarto-page" data-catalog-page="categories">
  <header class="smarto-page-heading">
    <div>
      <p class="smarto-eyebrow">Explore SmartO</p>
      <h1>Shop by category.</h1>
      <p>Choose a category to see its available products.</p>
    </div>
    <a class="smarto-button smarto-button-secondary" href="/products">All products</a>
  </header>
  <p id="categories-status" class="smarto-inline-status" role="status" aria-live="polite">Loading categories...</p>
  <div id="categories-list" class="smarto-category-list"></div>
</main>
<script type="module" src="/assets/intelligent_ordering/js/catalog-pages.js"></script>
{% endblock %}
