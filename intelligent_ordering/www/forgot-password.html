{% extends "templates/auth.html" %}
{% block title %}Forgot password | SmartO{% endblock %}
{% block auth_kind %}forgot{% endblock %}
{% block auth_heading %}Let's get you back in{% endblock %}
{% block auth_form %}
<h2>Forgot your password?</h2>
<form id="auth-form" class="smarto-checkout-form">
  <label>Email address <input name="email" type="email" maxlength="140" autocomplete="email" required></label>
  <button class="smarto-button" type="submit">Request reset link</button>
</form>
<p><a href="/login">Back to sign in</a></p>
{% endblock %}
