<section id="delivery-location-share" hidden aria-labelledby="delivery-location-heading">
  <h2 id="delivery-location-heading">My location and route</h2>
  <p>Share your current location once to help managers plan deliveries. It is not tracked continuously and expires for planning after 30 minutes. You can clear it at any time.</p>
  <button id="delivery-share-location" class="smarto-button smarto-button-secondary" type="button">Share current location</button>
  <button id="delivery-clear-location" class="smarto-button smarto-button-secondary" type="button">Clear shared location</button>
  <button id="delivery-my-route" class="smarto-button smarto-button-secondary" type="button">Show my suggested route</button>
  <div id="delivery-my-route-results" class="smarto-cart-items" aria-live="polite"></div>
</section>
